; Reads the CYD display controller ID and shows it on screen and serial
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps = lovyan03/LovyanGFX@1.1.16
lib_extra_dirs = ../../firmware/lib
