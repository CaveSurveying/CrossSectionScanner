; Maps raw touch readings over a grid of crosses, to see how the touch layer bends
[env:cyd]
; Old 2.8" CYD (faulty touch). The E32R24P below uses the same USB port name.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps = lovyan03/LovyanGFX@1.1.16
lib_extra_dirs = ../../firmware/lib

[env:e32r24p]
extends = env:cyd
build_flags = -DBOARD_E32R24P
